<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | beans by beans</title>
    <link rel="icon" href="/images/beans-logo.png" type="image/png">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <header class="site-header">
        <nav class="nav container">
            <a class="brand" href="/">
                <img src="/images/beans-logo.png" alt="beans by beans logo">
            </a>

            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/menu" class="active" aria-current="page">Menu</a>
                <a href="/about">About</a>
                <a href="/contact">Contact</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="menu-section container">
            <div class="menu-heading">
                <span class="eyebrow">MADE FOR EVERY MOOD</span>
                <h1>Something good is brewing.</h1>
                <p>From your everyday coffee favorites to something a little sweeter, find your perfect cup at beans by
                    beans.</p>
            </div>


            <div class="menu-categories">
                <button class="category-btn active" data-filter="all">All Items</button>
                <button class="category-btn" data-filter="coffee">Coffee</button>
                <button class="category-btn" data-filter="non-coffee">Non-Coffee</button>
                <button class="category-btn" data-filter="pastry">Pastries</button>
                <button class="category-btn" data-filter="hot">Hot Drinks</button>
                <button class="category-btn" data-filter="iced">Iced Drinks</button>
            </div>

            <div id="drinkList" class="drink-grid">
                <p>Loading our menu...</p>
            </div>

        </section>
    </main>

    <footer class="footer">
    <div class="container">
        <span>&copy; 2026 beans by beans</span>
        <span>Thoughtfully brewed, simply enjoyed.</span>
    </div>
</footer>

    <script src="/js/menu.js"></script>
</body>

</html>
